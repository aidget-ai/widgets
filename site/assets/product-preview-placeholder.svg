    <rect x="216" y="138" width="1168" height="54" rx="27" fill="#29251f"/>
    <circle cx="254" cy="165" r="7" fill="#4c64ce"/>
    <circle cx="278" cy="165" r="7" fill="#6d655d"/>
    <circle cx="302" cy="165" r="7" fill="#d7cbbd"/>
