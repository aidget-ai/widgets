    <rect x="311" y="284" width="978" height="1" fill="#d8cec2"/>
    <g transform="translate(706 365)">
      <rect width="188" height="188" rx="42" fill="#2c2823"/>
      <rect x="38" y="43" width="112" height="102" rx="17" fill="#4c64ce"/>
