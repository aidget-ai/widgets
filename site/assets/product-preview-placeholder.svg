<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Aidget product screenshot placeholder</title>
  <desc id="desc">A neutral desktop scene with a central placeholder panel.</desc>
  <defs>
    <radialGradient id="wash" cx="50%" cy="38%" r="74%">
      <stop offset="0" stop-color="#dce5ff"/>
      <stop offset=".55" stop-color="#eef1f7"/>
      <stop offset="1" stop-color="#cbd2df"/>
    </radialGradient>
    <linearGradient id="desk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7f8fa"/>
      <stop offset="1" stop-color="#d8dce5"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="28" stdDeviation="28" flood-color="#26304f" flood-opacity=".16"/>
