<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="aidget-surface" content="none" />
    <link rel="stylesheet" href="style.css" />
    <title>GLM · 亚克力挂件</title>
  </head>
  <body>
    <main class="stage" data-aidget-region="stage">
      <div class="pendant" role="img" aria-label="GLM 睡衣猫娘亚克力挂件">
        <div class="pendant-art" aria-hidden="true"></div>
        <div class="pendant-shine" aria-hidden="true">
          <span class="shine-spot"></span>
          <span class="shine-streak"></span>
        </div>
      </div>
    </main>
    <script>
      (() => {
        const pendant = document.querySelector('.pendant');
        const root = document.documentElement;
        const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
        const REST = { x: 0.3, y: 0.2 };
        const IDLE_GLOW = 0.42;
        const clamp = (value, lo, hi) => Math.min(hi, Math.max(lo, value));
        let target = { ...REST };
        let pos = { ...REST };
        let glow = { value: 0, target: IDLE_GLOW };
        let running = false;
        let previousTime = null;

        function paint() {
          root.style.setProperty('--mx', `${(pos.x * 100).toFixed(2)}%`);
          root.style.setProperty('--my', `${(pos.y * 100).toFixed(2)}%`);
          root.style.setProperty('--shine', glow.value.toFixed(3));
        }

        function tick(timestamp) {
          const elapsed =
            previousTime === null
              ? 1000 / 60
              : Math.min(100, Math.max(0, timestamp - previousTime));
          previousTime = timestamp;
          const ease = reduceMotion.matches ? 1 : 1 - Math.pow(0.82, elapsed / (1000 / 60));
          pos.x += (target.x - pos.x) * ease;
          pos.y += (target.y - pos.y) * ease;
          glow.value +=
            (glow.target - glow.value) *
            (reduceMotion.matches ? 1 : 1 - Math.pow(0.88, elapsed / (1000 / 60)));
          paint();
          const settled =
            Math.abs(target.x - pos.x) < 0.002 &&
            Math.abs(target.y - pos.y) < 0.002 &&
            Math.abs(glow.target - glow.value) < 0.004;
          if (settled) {
            pos = { ...target };
            glow.value = glow.target;
            paint();
            running = false;
            previousTime = null;
            return;
          }
          window.aidget.requestAnimationFrame(tick);
        }

        function wake() {
          if (!running) {
            running = true;
            window.aidget.requestAnimationFrame(tick);
          }
        }

        function follow(x, y) {
          const rect = pendant.getBoundingClientRect();
          if (!rect.width || !rect.height) return;
          target.x = clamp((x - rect.left) / rect.width, 0, 1);
          target.y = clamp((y - rect.top) / rect.height, 0, 1);
          glow.target = 1;
          wake();
        }

        function rest() {
          target = { ...REST };
          glow.target = IDLE_GLOW;
          wake();
        }

        window.aidget.onPointer((event) => {
          if (event.type === 'leave') {
            rest();
            return;
          }
          follow(event.x, event.y);
        });
        document.addEventListener('visibilitychange', () => {
          if (document.hidden) rest();
        });
        paint();
        wake();
        if (window.aidget && typeof window.aidget.ready === 'function') {
          window.aidget.ready();
        }
      })();
    </script>
  </body>
</html>
