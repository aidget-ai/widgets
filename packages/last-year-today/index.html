<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="aidget-surface" content="none" />
    <title>去年今日</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="memory-card" aria-label="去年今日">
      <div class="scrim" aria-hidden="true"></div>

      <header class="date-lockup">
        <div class="day" data-aidget-region="date-day">
          <time datetime="2025-11-04">4</time>
        </div>
        <div class="date-meta" data-aidget-region="date-meta">
          <span class="month">/ November</span>
          <span class="year">2025, Tue</span>
        </div>
      </header>

      <div class="memory" data-aidget-region="memory">
        <p id="memory-text">有些故事，要在黑夜里点灯才看得见。</p>
      </div>
    </main>
  </body>
</html>
