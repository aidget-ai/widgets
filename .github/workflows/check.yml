name: Check
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm ci --ignore-scripts
      - run: npm test
      - name: Validate registry and package versions
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/check.mjs ${BASE_SHA:+"$BASE_SHA"}
