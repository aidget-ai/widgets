name: Publish
on:
  push:
    branches: [main]
    paths:
      [
        'packages/**',
        'schemas/**',
        'registry.json',
        'scripts/**',
        'package.json',
        'pnpm-lock.yaml',
        'pnpm-workspace.yaml',
        'vite.config.ts',
        'tsconfig.json',
        '.github/workflows/publish.yml',
      ]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: publish-widgets
  cancel-in-progress: false
jobs:
  npm:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - uses: pnpm/setup@v3.1.1
        with:
          version: 12.15.0
          cache: true
          install: false
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm exec vp check
      - run: pnpm test
      - run: pnpm validate
      - run: node scripts/pack.mjs "$RUNNER_TEMP/packed"
      - name: Publish missing npm versions
        run: node scripts/publish.mjs "$RUNNER_TEMP/packed"
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
